# H2 Database Configuration for Tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration for Test Schema Generation
# This is the MOST IMPORTANT part for your current error
#This will create tables for each test run and drop them after
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# If you are using Spring Boot 3.x and Jakarta Persistence, ensure you have
# the correct platform dialect (though Hibernate often auto-detects H2)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect